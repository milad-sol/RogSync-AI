<select name="prompt_template_id" id="{{ select_id }}" {% if required %}required{% endif %}
        class="bg-slate-50 border border-slate-200 rounded-lg px-3 py-1.5 text-[12px] text-slate-700 focus:outline-none focus:ring-2 focus:ring-brand-500/30 focus:border-brand-400 transition appearance-none cursor-pointer min-w-[160px] {{ extra_class }}">
  <option value="">انتخاب قالب پرامپت…</option>
  {% for item in prompt_templates %}
  <option value="{{ item.pk }}" {% if selected_id == item.pk %}selected{% endif %}>{{ item.title }}</option>
  {% endfor %}
</select>
