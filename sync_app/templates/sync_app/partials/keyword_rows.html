{% for keyword in keywords %}
<tr class="hover:bg-slate-50 transition-colors border-b border-slate-100 last:border-0 group">
    <td class="px-6 py-4 whitespace-nowrap">
        <span class="text-[14px] font-medium text-slate-700">{{ keyword.word }}</span>
    </td>
    <td class="px-6 py-4 whitespace-nowrap">
        {% if keyword.priority == 3 %}
            <span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-semibold bg-red-50 text-red-700 ring-1 ring-red-600/20">
                بالا (High)
            </span>
        {% elif keyword.priority == 2 %}
            <span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-semibold bg-orange-50 text-orange-700 ring-1 ring-orange-600/20">
                متوسط (Medium)
            </span>
        {% else %}
            <span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-semibold bg-slate-100 text-slate-700 ring-1 ring-slate-600/20">
                پایین (Low)
            </span>
        {% endif %}
    </td>
    <td class="px-6 py-4 whitespace-nowrap">
        <form hx-post="{% url 'sync_app:keyword_toggle' keyword.pk %}"
              hx-target="#keyword-tbody"
              class="inline-block">
            {% csrf_token %}
            <button type="submit"
                    class="relative inline-flex h-5 w-9 flex-shrink-0 cursor-pointer rounded-full border-2 border-transparent transition-colors duration-200 ease-in-out focus:outline-none focus:ring-2 focus:ring-brand-500 focus:ring-offset-2 {% if keyword.is_active %}bg-brand-500{% else %}bg-slate-200{% endif %}">
                <span class="translate-x-0 inline-block h-4 w-4 transform rounded-full bg-white shadow ring-0 transition duration-200 ease-in-out {% if keyword.is_active %}-translate-x-4{% else %}translate-x-0{% endif %}"></span>
            </button>
        </form>
    </td>
    <td class="px-6 py-4 whitespace-nowrap text-left text-sm font-medium opacity-0 group-hover:opacity-100 transition-opacity">
        <form hx-post="{% url 'sync_app:keyword_delete' keyword.pk %}"
              hx-target="#keyword-tbody"
              hx-confirm="آیا از حذف این کلمه کلیدی اطمینان دارید؟"
              class="inline-block">
            {% csrf_token %}
            <button type="submit" class="text-red-500 hover:text-red-700 bg-red-50 hover:bg-red-100 px-3 py-1.5 rounded-lg transition-colors">
                حذف
            </button>
        </form>
    </td>
</tr>
{% empty %}
<tr>
    <td colspan="4" class="px-6 py-8 text-center text-sm text-slate-500">
        هیچ کلمه‌ کلیدی یافت نشد.
    </td>
</tr>
{% endfor %}
