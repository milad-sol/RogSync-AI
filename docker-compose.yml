name: rogsync

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-rogsync}
      POSTGRES_USER: ${POSTGRES_USER:-rogsync}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rogsync}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-rogsync} -d ${POSTGRES_DB:-rogsync}"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  web:
    build: .
    command: gunicorn rogsync.wsgi:application --bind 0.0.0.0:8000 --workers 2 --timeout 120
    env_file:
      - path: .env
        required: false
    environment:
      RUN_MIGRATIONS: "1"
      USE_POSTGRES: "true"
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB:-rogsync}
      POSTGRES_USER: ${POSTGRES_USER:-rogsync}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rogsync}
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      ALLOWED_HOSTS: localhost,127.0.0.1,web,0.0.0.0
    ports:
      - "8000:8000"
    volumes:
      - media_data:/app/media
      - static_data:/app/staticfiles
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/', timeout=3)",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  worker:
    build: .
    command: celery -A rogsync worker -l info --concurrency=2
    env_file:
      - path: .env
        required: false
    environment:
      RUN_MIGRATIONS: "0"
      USE_POSTGRES: "true"
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB:-rogsync}
      POSTGRES_USER: ${POSTGRES_USER:-rogsync}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rogsync}
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
    volumes:
      - media_data:/app/media
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      web:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
  media_data:
  static_data:
